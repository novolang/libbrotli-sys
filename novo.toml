[package]
name        = "libbrotli-sys"
version     = "0.1.0"
description = "Bindings over libbrotlidec, the Brotli decoder: the decoder instance, the one-shot and streaming decompression, the output drain, the error reporting and the version, one declaration per C entry point."
license     = "Apache-2.0"

# NOT a `0.0.x` draft.  An interface release is the shape whose every
# `pub fn` body is a `todo()`, and every `pub fn` here is an `@ffi`
# declaration with no body at all — `novo pkg publish` reads that as a
# release with bodies and refuses a `0.0.x` version for it.
stability   = "experimental"

# `sys`: the layer for a package that binds one C library and decides
# nothing of its own.  Every `pub fn` below is an `@ffi` declaration of
# a function in libbrotlidec.
layer       = "sys"

category    = "bindings"

# The one C library.  Brotli ships as three: `libbrotlicommon.so` holds
# the shared tables, `libbrotlidec.so` the decoder and
# `libbrotlienc.so` the encoder.  A `sys` package wraps one library, and
# this one wraps the decoder, whose symbols all begin `BrotliDecoder`.
# The encoder is named in the README under "What is not included".
wraps       = "libbrotlidec"

tags        = ["ffi", "brotli", "decompression", "codec", "bindings"]
repository  = "https://github.com/novolang/libbrotli-sys"
maintainers = ["novo-lang"]
novo        = ">= 0.8.9"

[docs.pages]
"README.md" = "The C entry points of libbrotlidec, one novo-lang declaration each"

[dependencies]
# None.  A binding over one C library depends on no novo-lang package.

# The link flag for the `library = "brotlidec"` name every declaration
# in `src/` carries.  `libbrotli-dev` installs
# `/usr/lib/<arch>/pkgconfig/libbrotlidec.pc`, so pkg-config answers
# `-lbrotlidec` on Debian and Ubuntu, and brings `libbrotlicommon` with
# it.  Without the block the default is `-lbrotlidec` alone, which does
# not link on a system whose decoder is not already joined to the
# common library.
[ffi.brotlidec]
pkg_config = "libbrotlidec"
